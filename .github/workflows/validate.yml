name: Validate community release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_project.py
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_card.cjs
      - run: sh -n install_external_audio.sh
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build external audio app (amd64; no real credentials or calls)
        run: docker build --tag comelit-external-audio:ci addons/comelit_external_audio
      - name: Validate gateway Python in container
        run: docker run --rm --entrypoint python3 comelit-external-audio:ci -m py_compile /opt/comelit/gateway.py
